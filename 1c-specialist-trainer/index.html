<title>Тренажёр 1С:Специалист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: рабочее место разработчика — шапка с прогрессом и отсчётом до экзамена, вкладки разделов, двухколоночные экраны (список слева, содержимое справа), тёмные блоки кода как в конфигураторе. */
:root {
  --bg: #EDF1F4;
  --surface: #FFFFFF;
  --surface-2: #F6F8FA;
  --ink: #15202B;
  --muted: #586674;
  --line: #D3DBE2;
  --accent: #0D6E6E;
  --accent-soft: #D8EEEC;
  --accent-ink: #FFFFFF;
  --ok: #257A4C;
  --ok-soft: #DCF1E4;
  --bad: #B83232;
  --bad-soft: #F8E0E0;
  --warn: #9A6412;
  --warn-soft: #F7ECD6;
  --code-bg: #111A22;
  --code-fg: #D6E0E8;
  --code-kw: #F2B861;
  --code-str: #8FD19E;
  --code-q: #7FC8F8;
  --code-com: #7A8894;
  --code-dir: #E58FB8;
  --code-num: #F59E7A;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1318; --surface: #141C23; --surface-2: #19232B; --ink: #E2E9EF; --muted: #93A1AD; --line: #27333D;
    --accent: #43B7AC; --accent-soft: #173634; --accent-ink: #081312;
    --ok: #5BC38A; --ok-soft: #173424; --bad: #F08080; --bad-soft: #3A1C1E; --warn: #E8B75A; --warn-soft: #36291A;
    --code-bg: #0A1016; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1318; --surface: #141C23; --surface-2: #19232B; --ink: #E2E9EF; --muted: #93A1AD; --line: #27333D;
  --accent: #43B7AC; --accent-soft: #173634; --accent-ink: #081312;
  --ok: #5BC38A; --ok-soft: #173424; --bad: #F08080; --bad-soft: #3A1C1E; --warn: #E8B75A; --warn-soft: #36291A;
  --code-bg: #0A1016; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(20px, 3.2vw, 28px); letter-spacing: -0.01em; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 19px; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; justify-content: space-between; padding-block: 18px; }
.brand { display: grid; gap: 4px; min-width: 0; }
.brand .sub { color: var(--muted); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.stat { display: grid; gap: 2px; }
.stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
.meter { width: 160px; height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.examdate input { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.sync { font-size: 12px; color: var(--muted); }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs-inner button { background: none; border: 0; padding: 12px 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs-inner button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-block: 24px 60px; }
.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .split { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 6px; position: sticky; top: 64px; }
@media (max-width: 820px) { .side { position: static; } }
.side button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.side button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.side button .t { min-width: 0; }
.side button small { color: var(--muted); display: block; font-size: 12px; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 16px; min-width: 0; }
.panel > * { min-width: 0; }
.prose { display: grid; gap: 12px; max-width: 72ch; }
.prose ul, .prose ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.callout { border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.callout.warn { background: var(--warn-soft); }
.callout.warn .label { color: var(--warn); }
.callout.tip { background: var(--accent-soft); }
.callout.tip .label { color: var(--accent); }
.callout ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }

pre.code { margin: 0; background: var(--code-bg); color: var(--code-fg); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; padding: 14px 16px; border-radius: 8px; overflow-x: auto; tab-size: 4; }
.code .k { color: var(--code-kw); font-weight: 600; }
.code .s { color: var(--code-str); }
.code .q { color: var(--code-q); font-weight: 600; }
.code .c { color: var(--code-com); font-style: italic; }
.code .d { color: var(--code-dir); }
.code .n { color: var(--code-num); }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: 0.55; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
textarea, .field { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); padding: 10px 12px; }
textarea.codearea { font-family: var(--font-mono); font-size: 12.5px; min-height: 280px; resize: vertical; tab-size: 4; }
select.field { width: auto; }

/* Plan */
.plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.week { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; align-content: start; }
.week.done { border-color: var(--ok); }
.week.now { box-shadow: inset 0 0 0 1px var(--accent); border-color: var(--accent); }
.week header { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.week ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 14px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.modstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.modstat { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; background: var(--surface); }
.modstat .bars { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
.bar { display: grid; grid-template-columns: 60px 1fr 36px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.bar .meter { width: 100%; height: 6px; }

/* Tests */
.q-card { display: grid; gap: 12px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; }
.opt .letter { font-family: var(--font-mono); color: var(--muted); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; color: var(--ink); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.ok { background: var(--ok); }
.dots i.bad { background: var(--bad); }
.dots i.cur { background: var(--accent); }
.result-big { font-family: var(--font-display); font-size: 32px; font-variant-numeric: tabular-nums; }

/* Tasks */
.crit { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.crit li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.crit input { margin-top: 3px; accent-color: var(--accent); }
.timer { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.review { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; background: var(--surface-2); }
.review .score { font-family: var(--font-display); font-size: 26px; }
.review ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.sev { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; }
.sev.critical { color: var(--bad); } .sev.major { color: var(--warn); } .sev.minor { color: var(--muted); }
details { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
details summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 10px; }
.answer-stream { white-space: pre-wrap; font-size: 14px; }

/* Cases */
.step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.step .num { font-family: var(--font-display); font-size: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.step .body { display: grid; gap: 10px; min-width: 0; }

.foot { padding-block: 24px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <h1>Тренажёр 1С:Специалист</h1>
      <div class="sub">Платформа 8.3 · 12 недель: теория, тесты, задачи в формате билета, разборы</div>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">Общий прогресс</span><div class="row"><div class="meter"><i id="totalBar" style="width:0%"></i></div><b id="totalPct">0%</b></div></div>
      <div class="stat"><span class="label">До экзамена</span><b id="daysLeft">—</b></div>
      <label class="stat examdate"><span class="label">Дата экзамена</span><input type="date" id="examDate"></label>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Разделы">
  <div class="wrap tabs-inner" role="tablist" id="tabs"></div>
</nav>
<main class="wrap" id="view"></main>
<div class="wrap foot">
  <span id="syncState">Прогресс сохраняется в этом браузере.</span>

</div>

<script>
"use strict";
// ───────────────────────── ДАННЫЕ: теория ─────────────────────────
const MODULES = [
{ id: "m1", title: "Платформа и объекты", short: "Метаданные, модули, клиент-сервер",
  blocks: [
  { p: "Экзамен проверяет, умеете ли вы быстро собрать работающую прикладную задачу: правильно выбрать объекты метаданных, написать проведение и отчёт. Начните с карты объектов: для чего каждый нужен и где пишется код." },
  { h: "Какой объект для чего" },
  { list: [
    "<b>Справочник</b> — список однородных элементов (Номенклатура, Склады, Сотрудники). Иерархия, владельцы, табличные части.",
    "<b>Документ</b> — хозяйственное событие с датой. Проведение формирует движения по регистрам.",
    "<b>Перечисление</b> — фиксированный набор значений, задаётся в конфигураторе (ВидыНоменклатуры: Товар, Услуга).",
    "<b>Регистр сведений</b> — значения в разрезе измерений, может быть периодическим (цены, курсы, скидки). Читается через СрезПоследних.",
    "<b>Регистр накопления</b> — оперативный учёт: остатки или обороты количества и сумм.",
    "<b>План счетов + регистр бухгалтерии</b> — бухгалтерский учёт с двойной записью и субконто.",
    "<b>ПВР + регистр расчёта</b> — периодические расчёты: зарплата, вытеснение, базы.",
    "<b>Бизнес-процесс + задача</b> — маршрут согласования с исполнителями." ] },
  { h: "Где писать код" },
  { list: [
    "<b>Модуль объекта</b> — поведение конкретного объекта при записи и проведении: ПередЗаписью, ОбработкаПроведения, ОбработкаЗаполнения, ОбработкаПроверкиЗаполнения. Выполняется на сервере независимо от того, через какую форму записан объект.",
    "<b>Модуль менеджера</b> — процедуры, не привязанные к одному экземпляру: печать, ОбработкаПолученияДанныхВыбора, служебные функции.",
    "<b>Модуль формы</b> — интерфейс: реакция на изменение полей, команды. Код разделён директивами компиляции.",
    "<b>Общий модуль</b> — переиспользуемые функции; флаги Сервер, Клиент, ВызовСервера, Привилегированный." ] },
  { h: "Директивы компиляции в форме" },
  { code: `&НаКлиенте
Процедура КоличествоПриИзменении(Элемент)
	// Клиент: есть данные формы, нет доступа к базе
	Строка = Элементы.Товары.ТекущиеДанные;
	Строка.Сумма = Строка.Цена * Строка.Количество;
КонецПроцедуры

&НаСервере
Процедура ЗаполнитьНаСервере()
	// Сервер с контекстом: данные формы передаются на сервер и обратно
	ДокументОбъект = РеквизитФормыВЗначение("Объект");
	ДокументОбъект.Заполнить(Неопределено);
	ЗначениеВРеквизитФормы(ДокументОбъект, "Объект");
КонецПроцедуры

&НаСервереБезКонтекста
Функция ЦенаТовара(Номенклатура, Дата)
	// Сервер без контекста: форма не передаётся — самый дешёвый вызов
	...
КонецФункции` },
  { tip: ["Для простого чтения данных из базы по параметрам используйте &НаСервереБезКонтекста: форма не гоняется по сети.",
          "На клиенте нельзя выполнять запросы и обращаться к реквизитам ссылок через точку — только через вызов сервера."] },
  { warn: ["Код проведения в модуле формы (ПередЗаписью формы) вместо модуля объекта.",
           "Обращение Строка.Номенклатура.ВидНоменклатуры в цикле: каждая точка — отдельное чтение объекта из базы. Берите поля запросом.",
           "Запрос внутри цикла по строкам табличной части. Экзаменатор снимает за это баллы как за неоптимальную работу с данными."] }
  ] },
{ id: "m2", title: "Оперативный учёт", short: "Регистры накопления, проведение, себестоимость",
  blocks: [
  { p: "Самый частый блок билета. Нужно выбрать регистры накопления, написать проведение с контролем остатков и списанием себестоимости, а потом построить отчёт." },
  { h: "Остатки или обороты" },
  { list: [
    "<b>Остатки</b> — когда нужен баланс на момент времени (товары на складе, долги). Виртуальные таблицы: Остатки, Обороты, ОстаткиИОбороты. Движения — Приход и Расход.",
    "<b>Обороты</b> — когда нужны только суммы за период (продажи, выручка). Только виртуальная таблица Обороты. Движения без вида.",
    "<b>Измерения</b> — разрезы учёта (Номенклатура, Склад, Партия). <b>Ресурсы</b> — числа (Количество, Сумма). <b>Реквизиты</b> — справочная информация, не влияет на итоги." ] },
  { h: "Разрез регистра определяет задача" },
  { p: "Если количество контролируется по складам, а себестоимость считается по фирме в целом, делайте два регистра: один с измерением Склад, второй без него. Если средняя считается по складу — хватит одного регистра с Количеством и Суммой." },
  { h: "Скелет проведения с контролем остатков" },
  { code: `Процедура ОбработкаПроведения(Отказ, Режим)
	// 1. Очистить старые движения документа (иначе они попадут в остатки)
	Движения.ОстаткиТоваров.Записывать = Истина;
	Движения.ОстаткиТоваров.Записать();

	// 2. Заблокировать данные, которые будем читать и менять
	Блокировка = Новый БлокировкаДанных;
	Элемент = Блокировка.Добавить("РегистрНакопления.ОстаткиТоваров");
	Элемент.Режим = РежимБлокировкиДанных.Исключительный;
	Элемент.ИсточникДанных = Товары;
	Элемент.ИспользоватьИзИсточникаДанных("Номенклатура", "Номенклатура");
	Блокировка.Заблокировать();

	// 3. Один пакет: товары документа (сгруппированные) + остатки
	// 4. Контроль: сообщение о нехватке, Отказ = Истина
	// 5. Движения: ДобавитьРасход(), себестоимость
КонецПроцедуры` },
  { h: "Виртуальная таблица остатков" },
  { code: `ВЫБРАТЬ
	ВТ.Номенклатура,
	ВТ.Количество,
	ЕСТЬNULL(Ост.КоличествоОстаток, 0) КАК КоличествоОстаток,
	ЕСТЬNULL(Ост.СуммаОстаток, 0) КАК СуммаОстаток
ИЗ
	ВТ_Товары КАК ВТ
		ЛЕВОЕ СОЕДИНЕНИЕ РегистрНакопления.СтоимостьТоваров.Остатки(
				&МоментВремени,
				Номенклатура В (ВЫБРАТЬ Номенклатура ИЗ ВТ_Товары)) КАК Ост

  solution:`&НаКлиенте

КонецПроцедуры

&НаКлиенте
Процедура ТоварыКоличествоПриИзменении(Элемент)

	Запрос.УстановитьПараметр("Номенклатура", Номенклатура);
	Выборка = Запрос.Выполнить().Выбрать();
	Возврат ?(Выборка.Следующий(), Выборка.Цена, 0);
КонецФункции` }

// ───────────────────────── Состояние и хранение ─────────────────────────
const LS_KEY = "trainer1c.progress.v1";
const DEFAULT_EXAM = (() => { const d = new Date(); d.setDate(d.getDate() + 90); return d.toISOString().slice(0, 10); })();
function freshState() { return { theory:{}, tests:{}, tasks:{}, cases:{}, weeks:{}, crit:{}, examDate: DEFAULT_EXAM, updated: 0 }; }
let S = freshState();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(freshState(), JSON.parse(raw)); } catch (e) {}
let dbRef = null, dbApi = null, uid = null;

function mergeStates(a, b) {
  // Берём более свежее состояние целиком, но не теряем отметки из другого
  const [older, newer] = (a.updated || 0) > (b.updated || 0) ? [b, a] : [a, b];
  const out = Object.assign(freshState(), older, newer);
  for (const k of ["theory","cases","weeks","crit"]) out[k] = Object.assign({}, older[k] || {}, newer[k] || {});
  out.tests = Object.assign({}, older.tests || {}, newer.tests || {});
  out.tasks = Object.assign({}, older.tasks || {}, newer.tasks || {});
  return out;
}
let saveTimer = null;
function save() {
  S.updated = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (dbRef) dbRef.set(JSON.parse(JSON.stringify(S))).catch(() => setSync(false)); }, 800);
  renderHeader();
}
function setSync(ok) {
  document.getElementById("syncState").textContent = ok
    ? "Прогресс и черновики сохраняются в вашем аккаунте — доступны с любого устройства."
    : "Прогресс сохраняется в этом браузере.";
}
function draftKey(id) { return "trainer1c.draft." + id; }
function loadDraft(id) { try { return localStorage.getItem(draftKey(id)) || ""; } catch (e) { return ""; } }
const draftTimers = {};
function saveDraft(id, text) {
  try { localStorage.setItem(draftKey(id), text); } catch (e) {}
  clearTimeout(draftTimers[id]);
  draftTimers[id] = setTimeout(() => {
    if (dbApi && uid) dbApi.doc("data/users/" + uid + "/draft-" + id).set({ text, updated: Date.now() }).catch(() => {});
  }, 1200);
}
async function pullDraft(id) {
  if (!dbApi || !uid) return null;
  try { const s = await dbApi.doc("data/users/" + uid + "/draft-" + id).get(); return s.exists ? String(s.data().text || "") : null; } catch (e) { return null; }
}

async function connectStore() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    uid = id; dbApi = db;
    dbRef = db.doc("data/users/" + id + "/progress");
    const snap = await dbRef.get();
    if (snap.exists) { S = mergeStates(S, snap.data()); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
    await dbRef.set(JSON.parse(JSON.stringify(S)));
    setSync(true);
    render();
  } catch (e) { dbRef = null; setSync(false); }
}

// ───────────────────────── Утилиты ─────────────────────────
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const KW = new Set(("Процедура КонецПроцедуры Функция КонецФункции Если Тогда ИначеЕсли Иначе КонецЕсли Для Каждого Из По Цикл КонецЦикла Пока Возврат Новый Истина Ложь Неопределено И ИЛИ НЕ Перем Экспорт Продолжить Прервать Попытка Исключение КонецПопытки ВызватьИсключение Знач").split(" ").map(w => w.toLowerCase()));
const QKW = /(^|[^А-Яа-яЁёA-Za-z0-9_])(ВЫБРАТЬ|РАЗЛИЧНЫЕ|ПЕРВЫЕ|ПОМЕСТИТЬ|ИЗ|ГДЕ|КАК|И|ИЛИ|НЕ|В|ЛЕВОЕ|ПРАВОЕ|ВНУТРЕННЕЕ|ПОЛНОЕ|СОЕДИНЕНИЕ|ПО|СГРУППИРОВАТЬ|УПОРЯДОЧИТЬ|ИТОГИ|ИНДЕКСИРОВАТЬ|ОБЪЕДИНИТЬ|ВСЕ|СУММА|МАКСИМУМ|МИНИМУМ|КОЛИЧЕСТВО|ЕСТЬNULL|ВЫБОР|КОГДА|ТОГДА|ИНАЧЕ|КОНЕЦ|УБЫВ|ВОЗР)(?=[^А-Яа-яЁёA-Za-z0-9_]|$)/g;
function highlight(src) {
  const re = /(\/\/[^\n]*)|("(?:[^"]|"")*")|(&[А-Яа-яЁёA-Za-z]+)|([А-Яа-яЁёA-Za-z_][А-Яа-яЁёA-Za-z_0-9]*)|(\d+(?:\.\d+)?)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) {
      // В тексте запроса «//» внутри строки не встречается отдельно — это комментарий кода
      out += '<span class="c">' + esc(m[1]) + "</span>";
    } else if (m[2]) {
      out += '<span class="s">' + esc(m[2]).replace(QKW, '$1<span class="q">$2</span>') + "</span>";
    } else if (m[3]) {
      out += '<span class="d">' + esc(m[3]) + "</span>";
    } else if (m[4]) {
      out += KW.has(m[4].toLowerCase()) ? '<span class="k">' + esc(m[4]) + "</span>" : esc(m[4]);
    } else if (m[5]) {
      out += '<span class="n">' + m[5] + "</span>";
    }
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
// Код без строк: запрос вне кавычек (блоки «Виртуальная таблица» в теории) — подсветить ключевые слова запроса
function highlightAny(src) {
  if (/^\s*ВЫБРАТЬ/.test(src)) return esc(src).replace(QKW, '$1<span class="q">$2</span>').replace(/(&amp;[А-Яа-яЁёA-Za-z]+)/g, '<span class="d">$1</span>');
  return highlight(src);
}
const codeBlock = src => '<pre class="code">' + highlightAny(src) + "</pre>";
const modTitle = id => (MODULES.find(m => m.id === id) || {}).title || "";
function pct(n, d) { return d ? Math.round(n / d * 100) : 0; }

// ───────────────────────── Метрики ─────────────────────────
function modStats(mid) {
  const qs = QUESTIONS.filter(q => q.m === mid);
  const right = qs.filter(q => S.tests[q.id] === true).length;
  const ts = TASKS.filter(t => t.m === mid);
  const tDone = ts.filter(t => S.tasks[t.id] && S.tasks[t.id].done).length;
  const cs = CASES.filter(c => c.m === mid);
  const cDone = cs.filter(c => S.cases[c.id]).length;
  return { read: !!S.theory[mid], qTotal: qs.length, qRight: right, tTotal: ts.length, tDone, cTotal: cs.length, cDone };
}
function totalProgress() {
  const units = MODULES.length + QUESTIONS.length + TASKS.length * 3 + CASES.length * 2 + WEEKS.length;
  let got = MODULES.filter(m => S.theory[m.id]).length;
  got += QUESTIONS.filter(q => S.tests[q.id] === true).length;
  got += TASKS.filter(t => S.tasks[t.id] && S.tasks[t.id].done).length * 3;
  got += CASES.filter(c => S.cases[c.id]).length * 2;
  got += WEEKS.filter(w => S.weeks[w.n]).length;
  return pct(got, units);
}
function daysLeft() {
  if (!S.examDate) return null;
  const t = new Date(S.examDate + "T00:00:00"); const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((t - now) / 86400000);
}
function currentWeek() {
  const d = daysLeft(); if (d === null) return 1;
  const w = 12 - Math.ceil(d / 7) + 1;
  return Math.min(12, Math.max(1, w));
}

// ───────────────────────── Теория ─────────────────────────
let askCtl = null;

async function getSample() { try { return window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { return null; } }
function sampleErr(e) {
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled" || c === "capability_removed") return "Проверка через Claude недоступна в этом просмотре.";
  if (c === "rate_limited") return "Слишком много запросов или исчерпан лимит. Попробуйте позже.";
  if (c === "session_expired") return "Сессия истекла — войдите в Claude заново.";
  if (c === "invalid_json") return "Не удалось разобрать ответ. Нажмите ещё раз.";
  if (c === "prompt_too_large") return "Решение слишком длинное — отправьте главное: проведение и метаданные.";
  return "Не получилось получить ответ. Попробуйте ещё раз.";
}
function wireAsk(v, m) {
  const btn = v.querySelector("#askBtn"), stop = v.querySelector("#askStop"), out = v.querySelector("#askOut"), ta = v.querySelector("#askText");
  getSample().then(s => { if (!s) v.querySelector("#askBox").hidden = true; });
  stop.onclick = () => askCtl && askCtl.abort();
  btn.onclick = async () => {
    const q = ta.value.trim(); if (!q) { ta.focus(); return; }
    const sample = await getSample(); if (!sample) return;
    const ctx = m.blocks.map(b => b.h || b.p || (b.list || []).join("; ") || b.code || (b.tip || b.warn || []).join("; ")).join("\n").replace(/<[^>]+>/g, "").slice(0, 6000);
    askCtl = new AbortController(); btn.disabled = true; stop.hidden = false; out.textContent = "Думаю…";
    try {
      await sample(`Ты — преподаватель, готовящий к экзамену «1С:Специалист по платформе 1С:Предприятие 8.3». Отвечай по-русски, конкретно, с коротким примером кода на встроенном языке 1С, если он помогает. Без markdown-заголовков, до 250 слов.\n\nТема модуля: ${m.title}.\nКонспект модуля:\n${ctx}\n\nВопрос ученика: ${q}`,
        { signal: askCtl.signal, onText: ({ text }) => { out.textContent = text; } });
    } catch (e) { out.textContent = (e && e.text) || ""; if (e && e.code !== "cancelled") out.textContent += (out.textContent ? "\n\n" : "") + sampleErr(e); }
    btn.disabled = false; stop.hidden = true;
  };
}

// ───────────────────────── Тесты ─────────────────────────
let testCfg = { mode: "exam", mod: "all" };
let run = null; // { ids, i, answers: {id: idx} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startTest() {
  let pool = QUESTIONS;
  if (testCfg.mode === "module") pool = QUESTIONS.filter(q => q.m === testCfg.mod);
  if (testCfg.mode === "mistakes") pool = QUESTIONS.filter(q => S.tests[q.id] === false);
  let ids = shuffle(pool.map(q => q.id));
  if (testCfg.mode === "exam") ids = ids.slice(0, 15);
  run = { ids, i: 0, answers: {} };
}
function renderTests(v) {
  const mistakes = QUESTIONS.filter(q => S.tests[q.id] === false).length;
  const right = QUESTIONS.filter(q => S.tests[q.id] === true).length;
  const modOpts = MODULES.map(m => `<option value="${m.id}" ${testCfg.mod === m.id ? "selected" : ""}>${esc(m.title)}</option>`).join("");
  const setup = `<section class="panel">
    <div class="row between"><h2>Тесты</h2><span class="muted small">Верно отвечено: ${right} из ${QUESTIONS.length}</span></div>
    <div class="row">
      <button class="btn ${testCfg.mode === "exam" ? "primary" : ""}" data-mode="exam">Быстрый повтор · 15 случайных</button>
      <button class="btn ${testCfg.mode === "module" ? "primary" : ""}" data-mode="module">По модулю</button>
      <button class="btn ${testCfg.mode === "all" ? "primary" : ""}" data-mode="all">Все ${QUESTIONS.length}</button>

    </div></section>`;
  if (!run || !run.ids.length) {
    v.innerHTML = `<div style="display:grid;gap:16px">${setup}<section class="panel"><p class="muted">${run && !run.ids.length ? "В этом режиме нет вопросов." : "Выберите режим — тест начнётся сразу."}</p></section></div>`;
  } else if (run.i >= run.ids.length) {
    const ok = run.ids.filter(id => run.answers[id] === QUESTIONS.find(q => q.id === id).c).length;
    const passed = pct(ok, run.ids.length) >= 85;
    const wrongList = run.ids.filter(id => run.answers[id] !== QUESTIONS.find(q => q.id === id).c).map(id => { const q = QUESTIONS.find(x => x.id === id); return `<li><b>${esc(q.q)}</b><br><span class="muted">Верно: ${esc(q.a[q.c])}. ${esc(q.e)}</span></li>`; }).join("");
    v.innerHTML = `<div style="display:grid;gap:16px">${setup}<section class="panel">
      <span class="label">Результат</span>
      <div class="row"><span class="result-big">${ok} / ${run.ids.length}</span><span class="pill ${passed ? "ok" : "bad"}">${passed ? "зачёт" : "нужно повторить"}</span></div>
      <p class="muted small">Цель — 85% и выше.</p>

    v.querySelector("#again").onclick = () => { startTest(); render(); };
  } else {

    const answered = run.answers[q.id] !== undefined;
    const dots = run.ids.map((id, k) => { const qq = QUESTIONS.find(x => x.id === id); const a = run.answers[id]; return `<i class="${k === run.i ? "cur" : a === undefined ? "" : a === qq.c ? "ok" : "bad"}"></i>`; }).join("");
    const opts = q.a.map((t, k) => {
      let cls = ""; if (answered) { if (k === q.c) cls = "right"; else if (k === run.answers[q.id]) cls = "wrong"; }
      return `<button class="opt ${cls}" data-k="${k}" ${answered ? "disabled" : ""}><span class="letter">${"АБВГ"[k]}</span><span>${esc(t)}</span></button>`;
    }).join("");
    v.innerHTML = `<div style="display:grid;gap:16px">${setup}<section class="panel q-card">
      <div class="row between"><span class="label">Вопрос ${run.i + 1} из ${run.ids.length} · ${esc(modTitle(q.m))}</span><div class="dots">${dots}</div></div>
      <h3 style="font-size:17px">${esc(q.q)}</h3>
      <div class="opts">${opts}</div>
      ${answered ? `<div class="callout ${run.answers[q.id] === q.c ? "tip" : "warn"}"><span class="label">${run.answers[q.id] === q.c ? "Верно" : "Неверно"}</span><p>${esc(q.e)}</p></div>
      <div class="row"><button class="btn primary" id="next">${run.i + 1 < run.ids.length ? "Следующий вопрос" : "Итоги"}</button></div>` : ""}
    </section></div>`;
    v.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k; run.answers[q.id] = k; S.tests[q.id] = k === q.c; save(); render();
    });
    const nx = v.querySelector("#next"); if (nx) nx.onclick = () => { run.i++; render(); };
  }
  v.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { testCfg.mode = b.dataset.mode; if (testCfg.mode === "module" && testCfg.mod === "all") testCfg.mod = "m1"; startTest(); render(); });
  const ms = v.querySelector("#modSel"); if (ms) ms.onchange = () => { testCfg.mod = ms.value; startTest(); render(); };
}

// ───────────────────────── Задачи ─────────────────────────

      </div>
      ${t.solution ? `<details><summary>Эталонное решение</summary>${codeBlock(t.solution)}</details>` : ""}
      ${!t.solution && !t.caseId ? `<details><summary>Подсказка: ключевые шаги</summary><ol class="prose">${t.crit.map(c => `<li>${esc(c)}</li>`).join("")}</ol></details>` : ""}
    </section></div>`;
  v.querySelectorAll(".side button").forEach(b => b.onclick = () => { sel.tasks = b.dataset.id; render(); });
  const ta = v.querySelector("#sol");
  ta.value = loadDraft(t.id);
  pullDraft(t.id).then(txt => { if (txt !== null && txt !== ta.value && !ta.value.trim()) ta.value = txt; });
  ta.addEventListener("input", () => saveDraft(t.id, ta.value));
  ta.addEventListener("keydown", e => { if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("\t", s, ta.selectionEnd, "end"); saveDraft(t.id, ta.value); } });
  v.querySelector("#tStart").onclick = e => {
    timer.running = !timer.running; e.target.textContent = timer.running ? "Пауза" : "Старт";
    clearInterval(timer.h); if (timer.running) timer.h = setInterval(tick, 1000);
  };
  v.querySelector("#tReset").onclick = () => { timer.running = false; clearInterval(timer.h); timer.left = timer.total; render(); };
  v.querySelectorAll(".crit input").forEach(cb => cb.onchange = () => { S.crit[t.id] = Object.assign({}, S.crit[t.id], { [cb.dataset.k]: cb.checked }); save(); render(); });
  v.querySelector("#doneMark").onchange = e => { S.tasks[t.id] = Object.assign({}, S.tasks[t.id], { done: e.target.checked }); save(); render(); };
  const tc = v.querySelector("#toCase"); if (tc) tc.onclick = () => go("cases", t.caseId);
  if (st.review) showReview(v.querySelector("#revOut"), st.review);
  wireReview(v, t);
}
function showReview(box, r) {
  const sevName = { critical: "критично", major: "существенно", minor: "замечание" };
  const crit = (r.criteria || []).map(c => `<li>${c.ok ? "✓" : "✗"} <b>${esc(c.name || "")}</b>${c.comment ? " — " + esc(c.comment) : ""}</li>`).join("");
  const errs = (r.errors || []).map(e => `<li><span class="sev ${esc(e.level)}">${esc(sevName[e.level] || e.level || "")}</span>${esc(e.text || "")}</li>`).join("");
  const cls = r.verdict === "сдано" ? "ok" : r.verdict === "не сдано" ? "bad" : "warn";
  box.innerHTML = `<div class="review">
    <div class="row between"><div class="row"><span class="score">${Number(r.score) || 0}/100</span><span class="pill ${cls}">${esc(r.verdict || "")}</span></div><span class="small muted">${r.at ? "Проверено " + new Date(r.at).toLocaleString("ru-RU") : ""}</span></div>
    ${crit ? `<div><span class="label">Критерии</span><ul>${crit}</ul></div>` : ""}
    ${errs ? `<div><span class="label">Ошибки</span><ul>${errs}</ul></div>` : ""}
    ${r.advice ? `<div><span class="label">Что сделать дальше</span><p>${esc(r.advice)}</p></div>` : ""}
  </div>`;
}
function wireReview(v, t) {
  const btn = v.querySelector("#review"), stop = v.querySelector("#stopRev"), note = v.querySelector("#revNote"), out = v.querySelector("#revOut"), ta = v.querySelector("#sol");
  getSample().then(s => { if (!s) { btn.hidden = true; note.textContent = "Проверка через Claude недоступна — используйте самопроверку по критериям ниже."; } });
  stop.onclick = () => reviewCtl && reviewCtl.abort();
  btn.onclick = async () => {
    const code = ta.value.trim();
    if (code.length < 40) { note.textContent = "Вставьте решение: метаданные и код проведения."; ta.focus(); return; }
    const sample = await getSample(); if (!sample) return;
    reviewCtl = new AbortController(); btn.disabled = true; stop.hidden = false; note.textContent = "Экзаменатор читает решение… обычно 20–60 секунд.";
    const prompt = `Ты — экзаменатор на экзамене «1С:Специалист по платформе 1С:Предприятие 8.3». Проверь решение строго, как на реальном экзамене: корректность учёта, методика проведения (очистка движений, управляемые блокировки, контроль остатков), оптимальность (нет запросов в цикле и обращений к реквизитам ссылок через точку в цикле, отборы в параметрах виртуальных таблиц), соответствие условию.

УСЛОВИЕ ЗАДАЧИ:
${t.text}

КРИТЕРИИ:
${t.crit.map((c, i) => (i + 1) + ". " + c).join("\n")}

РЕШЕНИЕ УЧЕНИКА:
${code.slice(0, 30000)}

Ответь только JSON без пояснений вокруг:
{"score": число 0-100, "verdict": "сдано" | "доработать" | "не сдано", "criteria": [{"name": "краткое название критерия", "ok": true|false, "comment": "почему, одно предложение"}], "errors": [{"level": "critical" | "major" | "minor", "text": "ошибка и как исправить, со ссылкой на место в коде"}], "advice": "2-3 предложения: что тренировать дальше"}
Если часть решения не приложена (например, отчёт), отметь критерий как невыполненный с комментарием «не приложено». Пиши по-русски.`;
    try {
      const r = await sample.json(prompt, { signal: reviewCtl.signal, modelTier: "complex" });
      if (!r || typeof r !== "object") throw { code: "invalid_json" };
      r.at = Date.now();
      S.tasks[t.id] = Object.assign({}, S.tasks[t.id], { score: Number(r.score) || 0, review: r });
      if ((Number(r.score) || 0) >= 80) S.tasks[t.id].done = true;
      save(); note.textContent = ""; render();
    } catch (e) {
      if (e && e.code !== "cancelled") note.textContent = sampleErr(e); else note.textContent = "";
      btn.disabled = false; stop.hidden = true;
    }
  };
}

// ───────────────────────── Разборы ─────────────────────────
function renderCases(v) {
  const c = CASES.find(x => x.id === sel.cases) || CASES[0];
  const side = CASES.map(x => `<button data-id="${x.id}" aria-current="${x.id === c.id}"><span class="t">${esc(x.title)}<small>${esc(modTitle(x.m))}</small></span>${S.cases[x.id] ? '<span class="pill ok">✓</span>' : ""}</button>`).join("");
  let n = 0;
  const steps = c.steps.map(s => {
    if (s.warn) return `<div class="callout warn"><span class="label">Типичные ошибки</span><ul>${s.warn.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`;
    n++;
    return `<div class="step"><span class="num">${n}</span><div class="body"><h3>${esc(s.h)}</h3>
      ${s.p ? `<p>${esc(s.p)}</p>` : ""}${s.list ? `<ul class="prose" style="max-width:none">${s.list.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}${s.code ? codeBlock(s.code) : ""}</div></div>`;
  }).join("");
  v.innerHTML = `<div class="split"><aside class="side">${side}</aside>
    <section class="panel">
      <div class="row between"><h2>${esc(c.title)}</h2><button class="btn" id="toTask">Решить самому</button></div>
      <p class="muted small">Сначала попробуйте задачу «${esc(TASKS.find(t => t.id === c.taskId).title)}» сами, потом сверяйтесь по шагам. Повторите решение в своей базе — читать мало.</p>
      ${steps}
      <label class="check"><input type="checkbox" id="caseMark" ${S.cases[c.id] ? "checked" : ""}> Разобрал и повторил в своей базе</label>
    </section></div>`;
  v.querySelectorAll(".side button").forEach(b => b.onclick = () => { sel.cases = b.dataset.id; render(); });
  v.querySelector("#toTask").onclick = () => go("tasks", c.taskId);
  v.querySelector("#caseMark").onchange = e => { S.cases[c.id] = e.target.checked; save(); render(); };
}

// ───────────────────────── Старт ─────────────────────────
startTest();
render();
connectStore();
</script>
